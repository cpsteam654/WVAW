<style>
.wvaw-pledge{--ink:#10302A;--deep:#24603F;--mint:#A8E0CC;--teal:#1E6E66;--paper:#F1F6F1;--haze:#9CC9C0;--muted:#3B5A50;
  font-family:'Barlow',system-ui,sans-serif;color:var(--ink);box-sizing:border-box;max-width:1180px;margin:0 auto}
.wvaw-pledge *,.wvaw-pledge *::before,.wvaw-pledge *::after{box-sizing:border-box}
.wvaw-pledge .wv-head{text-align:center;margin-bottom:28px}
.wvaw-pledge .wv-eyebrow{margin:0 0 14px;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.wvaw-pledge h2{margin:0;font-family:'Alfa Slab One',serif;font-weight:400;font-size:clamp(40px,5vw,72px);line-height:1.02}

/* tabs (real radio buttons = Jotform field "I'm signing as") */
.wvaw-pledge .wv-tabs{margin:28px auto 0;display:inline-flex;gap:4px;padding:4px;background:var(--ink);border-radius:6px;border:0}
.wvaw-pledge .wv-tabs input{position:absolute;opacity:0;width:1px;height:1px}
.wvaw-pledge .wv-tabs label{min-height:48px;padding:0 22px;border-radius:4px;display:inline-flex;align-items:center;cursor:pointer;color:#DDEFE9;
  font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.wvaw-pledge .wv-tabs input:checked+label{background:var(--mint);color:var(--ink)}
.wvaw-pledge .wv-tabs input:focus-visible+label{outline:3px solid #fff;outline-offset:2px}

/* postcard */
.wvaw-pledge .wv-card{background:var(--paper);border-radius:6px;box-shadow:0 30px 60px rgba(16,48,42,.35);display:flex;flex-wrap:wrap;overflow:hidden;transform:rotate(-.6deg)}
.wvaw-pledge .wv-front{flex:1 1 380px;position:relative;min-height:460px;background:var(--mint);overflow:hidden}
.wvaw-pledge .wv-front svg{position:absolute;inset:0;width:100%;height:100%}
.wvaw-pledge .wv-front-text{position:relative;padding:44px 36px}
.wvaw-pledge .wv-greet{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--deep)}

.wvaw-pledge .wv-back{flex:1.15 1 460px;min-width:0;padding:16px 40px 36px;border-left:2px dashed var(--haze)}
.wvaw-pledge .wv-top{display:flex;gap:24px;align-items:flex-start}
.wvaw-pledge .wv-top-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:22px}
.wvaw-pledge .wv-stampbox{flex:none;position:relative;width:190px;height:124px}
.wvaw-pledge .wv-stamp{position:absolute;right:0;top:0;width:92px;height:112px;background:#fff;padding:6px;outline:3px dotted var(--paper);outline-offset:-3px;box-shadow:0 0 0 2px var(--haze)}
.wvaw-pledge .wv-grid{margin-top:22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 28px}
.wvaw-pledge .wv-span{grid-column:span 2}
.wvaw-pledge .wv-field{display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.wvaw-pledge .wv-row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wvaw-pledge input[type=text],.wvaw-pledge input[type=email],.wvaw-pledge input[type=url],.wvaw-pledge select{
  border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);font:400 18px 'Barlow',sans-serif;padding:8px 0;border-radius:0;width:100%;text-transform:none;letter-spacing:0}
.wvaw-pledge input:focus,.wvaw-pledge select:focus{outline:none;border-bottom:3px solid var(--teal)}
.wvaw-pledge fieldset{border:0;padding:0;margin:0}
.wvaw-pledge legend{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;padding:0}
.wvaw-pledge .wv-pills{display:flex;flex-wrap:wrap;gap:8px}
.wvaw-pledge .wv-pills input{position:absolute;opacity:0;width:1px;height:1px}
.wvaw-pledge .wv-pills label{min-height:44px;padding:0 16px;border-radius:4px;border:2px solid var(--ink);display:inline-flex;align-items:center;cursor:pointer;font-size:15px;font-weight:600}
.wvaw-pledge .wv-pills input:checked+label{background:var(--ink);color:#fff}
.wvaw-pledge .wv-pills input:focus-visible+label{outline:3px solid var(--teal);outline-offset:2px}
.wvaw-pledge .wv-check{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5}
.wvaw-pledge .wv-check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--teal);flex:none}
.wvaw-pledge .wv-upload{position:relative;display:flex;align-items:center;gap:16px;padding:16px;border:2px dashed #6E8A80;border-radius:4px;cursor:pointer;font-size:15px}
.wvaw-pledge .wv-upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.wvaw-pledge .wv-upload strong{display:block;font-size:17px}
.wvaw-pledge .wv-submit{margin-top:30px;min-height:60px;padding:0 32px;border:0;border-radius:4px;background:var(--ink);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:14px;

.wvaw-pledge .wv-submit:hover{transform:translateY(-2px)}
.wvaw-pledge .wv-submit[disabled]{opacity:.7;cursor:wait}
.wvaw-pledge [hidden]{display:none!important}
.wvaw-pledge .wv-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-width:640px){

  .wvaw-pledge .wv-tabs label{padding:0 14px;font-size:17px}

</style>

<script>
(function () {
  var form = document.getElementById('wvaw-pledge');
  if (!form) return;
  var ind = form.querySelector('.wv-ind'), org = form.querySelector('.wv-org');
  var label = form.querySelector('.wv-submit-label');

  // Show the right half of the postcard and switch off the other half's fields
  // so they aren't required or sent to Jotform.
  function setMode() {
    var isOrg = form.querySelector('input[name="q2_q2_radio0"]:checked').value === 'Organization';
    ind.hidden = isOrg; org.hidden = !isOrg;
    ind.querySelectorAll('input,select').forEach(function (el) { el.disabled = isOrg; });
    org.querySelectorAll('input,select').forEach(function (el) { el.disabled = !isOrg; });
    label.textContent = isOrg ? 'Join the coalition' : 'Send my pledge';
  }
  form.querySelectorAll('input[name="q2_q2_radio0"]').forEach(function (r) { r.addEventListener('change', setMode); });
  setMode();

  // Show the chosen logo file name
  var file = org.querySelector('input[type=file]'), title = org.querySelector('.wv-upload-title');
  file.addEventListener('change', function () { if (file.files[0]) title.textContent = file.files[0].name; });

  // Prevent double submits
  form.addEventListener('submit', function () {
    var btn = form.querySelector('.wv-submit');
    setTimeout(function () { btn.disabled = true; label.textContent = 'Sending…'; }, 0);
  });
})();
</script>
